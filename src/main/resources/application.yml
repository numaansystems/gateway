server:
  port: 9090
  servlet:
    context-path: /gateway
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: gateway
    
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: "${AZURE_CLIENT_ID:your-client-id}"
            client-secret: "${AZURE_CLIENT_SECRET:your-client-secret}"
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          azure:
            issuer-uri: "https://login.microsoftonline.com/${AZURE_TENANT_ID:your-tenant-id}/v2.0"

# Gateway configuration
gateway:
  allowed-redirect-domains:
    - app.example.com
    - localhost
  exchange-token:
    ttl-minutes: 2

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.numaansystems. gateway: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
